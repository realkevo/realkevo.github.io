<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Toptech Develops</title>

  <meta
    name="description"
    content="Explore movies, anime, manga, sports, live TV, games, music, eBooks, comics, Asian dramas, VPNs and adblockers."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">

  <a href="./" class="brand">
    <span>Toptech</span> Develops
  </a>

  <nav class="main-nav">
    <a href="./">Home</a>
    <a href="https://realkevo.github.io/stream/">Stream</a>
    <a href="https://realkevo.github.io/trends/">Top Trends</a>
  </nav>

</header>


<main>

  <section class="hero">

    <div class="hero-content">

      <span class="eyebrow">DIRECTORY</span>

      <h1>Explore The Web</h1>

      <p>
        Discover useful platforms and services across entertainment,
        technology, privacy, gaming, books and more.
      </p>

    </div>

  </section>


  <section class="directory-section">

    <div class="section-heading">

      <div>
        <span class="section-label">CATEGORIES</span>
        <h2>Browse directories</h2>
      </div>

    </div>


    <div id="categoryGrid" class="category-grid"></div>

  </section>

</main>


<footer>

  <div class="footer-inner">

    <a href="./" class="footer-brand">
      Toptech Develops
    </a>

    <p>
      © 2026 Toptech Develops
    </p>

  </div>

</footer>


<script src="data.js"></script>

<script>

const categoryGrid = document.getElementById("categoryGrid");

categories.forEach(category => {

  const card = document.createElement("a");

  card.className = "category-card";
  card.href = category.path;

  card.innerHTML = `

    <div class="category-icon">
      ${category.icon}
    </div>

    <div class="category-content">

      <h3>${category.name}</h3>

      <p>${category.description}</p>

    </div>

    <div class="category-arrow">
      →
    </div>

  `;

  categoryGrid.appendChild(card);

});

</script>

</body>
</html>
