<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stream Links - Toptech Develops</title>

  <meta
    name="description"
    content="Toptech Develops directory of streaming, entertainment, games, music, books, comics and other online resources."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      width: 100%;
      border-bottom: 1px solid #242424;
      background: #0d0d0d;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-inner {
      max-width: 1250px;
      margin: auto;
      padding: 18px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .brand span {
      color: #ffffff;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;

      font-size: 17px;
      font-weight: 600;
    }

    .nav a {
      color: #bdbdbd;
      transition: color 0.2s ease;
    }

    .nav a:hover {
      color: #ffffff;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 55px 24px 70px;
    }

    .hero {
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 0.95;
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .hero p {
      color: #999999;
      font-size: 18px;
      line-height: 1.6;
      max-width: 750px;
    }

    .search-wrap {
      margin: 30px 0 35px;
    }

    #search {
      width: 100%;

      background: #111111;
      border: 1px solid #292929;
      border-radius: 12px;

      color: #ffffff;

      padding: 17px 18px;

      font-size: 16px;
      outline: none;
    }

    #search:focus {
      border-color: #555555;
    }

    #search::placeholder {
      color: #777777;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .category-card {
      display: block;

      background: #111111;
      border: 1px solid #252525;
      border-radius: 14px;

      padding: 24px;

      min-height: 145px;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .category-card:hover {
      transform: translateY(-4px);
      border-color: #4a4a4a;
      background: #151515;
    }

    .category-number {
      color: #666666;
      font-size: 13px;
      font-weight: 700;

      margin-bottom: 16px;
    }

    .category-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      font-size: 23px;
      font-weight: 750;
    }

    .category-description {
      color: #777777;
      font-size: 14px;
      line-height: 1.5;

      margin-top: 10px;
      padding-right: 20px;
    }

    .arrow {
      color: #777777;
      font-size: 22px;

      transition:
        transform 0.2s ease,
        color 0.2s ease;
    }

    .category-card:hover .arrow {
      transform: translateX(5px);
      color: #ffffff;
    }

    .empty-state {
      grid-column: 1 / -1;

      padding: 50px 20px;

      text-align: center;

      color: #777777;

      border: 1px solid #252525;
      border-radius: 14px;
    }

    footer {
      border-top: 1px solid #202020;

      color: #666666;

      text-align: center;

      padding: 25px 20px;

      font-size: 14px;
    }

    @media (max-width: 900px) {
      .category-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .nav {
        gap: 18px;
      }
    }

    @media (max-width: 650px) {
      .topbar-inner {
        padding: 16px 18px;
      }

      .brand {
        font-size: 21px;
      }

      .nav {
        gap: 13px;
        font-size: 14px;
      }

      .container {
        padding: 42px 18px 60px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .category-grid {
        grid-template-columns: 1fr;
      }

      .category-name {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       TOP NAVIGATION
       ========================================================= -->

  <header class="topbar">

    <div class="topbar-inner">

      <a class="brand" href="../">
        <span>Toptech</span> Develops
      </a>

      <nav class="nav">

        <a href="../">
          Home
        </a>

        <a href="https://realkevo.github.io/stream/">
          Stream
        </a>

        <a href="https://realkevo.github.io/trends/">
          Top Trends
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->

  <main class="container">

    <section class="hero">

      <h1>
        Stream Links
      </h1>

      <p>
        Browse organized directories for movies, anime, sports, TV,
        manga, games, music, eBooks, comics and more.
      </p>

    </section>


    <!-- SEARCH -->

    <div class="search-wrap">

      <input
        type="search"
        id="search"
        placeholder="Search categories..."
        autocomplete="off"
      >

    </div>


    <!-- CATEGORY GRID -->

    <section
      class="category-grid"
      id="categoryGrid"
    ></section>

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer>
    © 2026 Toptech Develops
  </footer>


  <!-- =========================================================
       CATEGORY DATA + RENDERING
       ========================================================= -->

  <script>

    /*
     * These paths match the folders currently inside:
     *
     * streamlinks/
     *
     * Each local link points directly to that folder's index.html.
     */

    const categories = [

      {
        name: "Anime",
        description: "Anime streaming and related resources.",
        url: "./anime/"
      },

      {
        name: "Asian Drama",
        description: "Asian drama and series resources.",
        url: "./asian-drama/"
      },

      {
        name: "Comics",
        description: "Comics and graphic novel resources.",
        url: "./comics/"
      },

      {
        name: "eBooks",
        description: "eBooks, audiobooks and reading resources.",
        url: "./ebooks/"
      },

      {
        name: "Games",
        description: "PC and console gaming resources.",
        url: "./games/"
      },

      {
        name: "Live Sports",
        description: "Live sports websites and resources.",
        url: "./live-sports/"
      },

      {
        name: "Live TV",
        description: "Live television channels and resources.",
        url: "./livetv/"
      },

      {
        name: "Manga",
        description: "Manga reading resources.",
        url: "./manga/"
      },

      {
        name: "Movies & TV",
        description: "Movies and television resources.",
        url: "./movies/"
      },

      {
        name: "Music",
        description: "Music websites and related tools.",
        url: "./music/"
      },

      {
        name: "Torrents",
        description: "Torrent trackers and indexers.",
        url: "./torrents/"
      },

      {
        name: "Adult",
        description: "Adult Sites",
        url: "./adult"
      }

    ];


    const categoryGrid =
      document.getElementById("categoryGrid");

    const search =
      document.getElementById("search");


    /*
     * Escape text before inserting it into HTML.
     */

    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent = value;

      return div.innerHTML;

    }


    /*
     * Render all categories.
     */

    function renderCategories(filter = "") {

      categoryGrid.innerHTML = "";

      const normalizedFilter =
        filter.trim().toLowerCase();


      const filtered =
        categories.filter(category => {

          const searchableText = (
            category.name +
            " " +
            category.description
          ).toLowerCase();

          return searchableText.includes(
            normalizedFilter
          );

        });


      /*
       * No results.
       */

      if (filtered.length === 0) {

        categoryGrid.innerHTML = `
          <div class="empty-state">
            No categories found.
          </div>
        `;

        return;

      }


      /*
       * Create category cards.
       */

      filtered.forEach((category, index) => {

        const card =
          document.createElement("a");


        /*
         * The entire card is an actual link.
         */

        card.className =
          "category-card";

        card.href =
          category.url;


        /*
         * External categories open in a new tab.
         * Local category folders remain in the same tab.
         */

        if (
          category.url.startsWith("http://") ||
          category.url.startsWith("https://")
        ) {

          card.target = "_blank";
          card.rel = "noopener noreferrer";

        }


        card.innerHTML = `

          <div class="category-number">
            ${String(index + 1).padStart(2, "0")}
          </div>

          <div class="category-name">

            <span>
              ${escapeHtml(category.name)}
            </span>

            <span class="arrow">
              →
            </span>

          </div>

          <div class="category-description">
            ${escapeHtml(category.description)}
          </div>

        `;


        categoryGrid.appendChild(card);

      });

    }


    /*
     * Search categories as the user types.
     */

    search.addEventListener(
      "input",
      () => {

        renderCategories(
          search.value
        );

      }
    );


    /*
     * Initial render.
     */

    renderCategories();

  </script>

</body>
</html>
